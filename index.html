<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-help mind map</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="toolbar">
    <div>
      <h1>Self-help mind map</h1>
      <p>Move ideas around, edit their text, and double-click the canvas to add a thought.</p>
    </div>
    <button id="addNodeBtn" type="button">Add thought</button>
  </header>

  <main id="mapArea" aria-label="Mind map">
    <div class="node" id="node1" contenteditable="true" role="textbox">What am I feeling?</div>
    <div class="node" id="node2" contenteditable="true" role="textbox">What might help?</div>
  </main>



  <script src="script.js"></script>
</body>
</html>
