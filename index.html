<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-help mind map</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="toolbar">
    <div>
      <h1>For my bunny</h1>
      <p>.....</p>
    </div>
    <button id="addNodeBtn" type="button">Add thought</button>
  </header>

  <main id="mapArea" aria-label="Mind map">
    <div class="node" id="node1" contenteditable="true" role="textbox">What am I feeling?</div>
    <div class="node" id="node2" contenteditable="true" role="textbox">What might help?</div>
    <svg id="connections"></svg>
    div id="infoPanel" class="hidden">
  <h2 id="panelTitle"></h2>
  <div id="panelContent"></div>
  <button id="closePanel">Close</button>


  </main>
  

  <script src="script.js"></script>





</body>
</html>
